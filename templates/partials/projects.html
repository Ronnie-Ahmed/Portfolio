<section id="work" class="flex flex-col py-20 mt-6 bg-gray-400 rounded-2xl shadow-md hover:shadow-2xl shadow-slate-50">
  <div class="container mx-auto mb-10 px-4 flex flex-wrap justify-center items-center">
    <div class="flex flex-col text-center items-center mb-6 mx-6 rounded-lg shadow-2xl shadow-black">
      <h1 class="text-3xl p-6 font-bold text-gray-800 tracking-wide leading-tight">Projects</h1>
    </div>
  </div>

  <div class="grid gap-4 p-5 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
    {% for p in projects %}
    <div class="relative rounded-lg shadow-lg p-6 overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-full rounded-lg"
           style="background-image: url('/static/images/{{ p.image }}'); background-size: cover; filter: blur(8px);"></div>
      <div class="relative">
        <div class="mb-4 group">
          <img src="/static/images/{{ p.image }}" alt="{{ p.title }}" loading="lazy"
               class="w-full h-auto rounded-lg shadow-lg object-cover transition-all duration-300 group-hover:scale-105 group-hover:rotate-3">
        </div>
        <h3 class="text-2xl font-bold mb-2 rounded-xs text-center bg-gray-400 text-black">{{ p.title }}</h3>
        <p class="font-bold bg-gray-400 rounded-xs">{{ p.description }}</p>

        <div class="flex flex-wrap gap-3 mt-3">
          <a href="{{ p.github }}" target="_blank" rel="noopener noreferrer"
             class="inline-block bg-gradient-to-r from-blue-500 via-gray-500 to-blue-600 text-white px-4 py-2 rounded-md shadow-md hover:shadow-lg transition-all duration-300 hover:scale-105">
            View on GitHub
          </a>
          {% if let Some(live) = p.live %}
          <a href="{{ live }}" target="_blank" rel="noopener noreferrer"
             class="inline-block bg-gradient-to-r from-blue-500 via-gray-500 to-blue-600 text-white px-4 py-2 rounded-md shadow-md hover:shadow-lg transition-all duration-300 hover:scale-105">
            Live
          </a>
          {% endif %}
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
