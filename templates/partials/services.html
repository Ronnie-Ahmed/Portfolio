<section id="services" class="flex flex-col py-20 mt-6 bg-gray-400 rounded-2xl shadow-md hover:shadow-2xl shadow-slate-50">
  <div class="container mx-auto mb-10 px-4 flex flex-wrap justify-center items-center">
    <div class="flex flex-col text-center items-center mb-6 mx-6 rounded-lg shadow-2xl shadow-black">
      <h1 class="text-3xl p-6 font-bold text-gray-800 tracking-wide leading-tight">Services</h1>
    </div>
  </div>

  {% for service in services %}
  <div class="flex flex-col md:flex-row items-center mx-4 md:mx-16 bg-gradient-to-r from-gray-500 to-gray-950 rounded-lg p-8 shadow-xl hover:shadow-2xl shadow-black transform transition-all duration-300 hover:scale-105 mb-10">
    <div>
      <img src="/static/images/{{ service.image }}" alt="Service illustration" loading="lazy"
           class="max-w-full h-auto rounded-lg shadow-lg hover:shadow-2xl shadow-sky-950 transform hover:scale-105 transition-all duration-300">
    </div>
    <div class="mt-4 text-center md:text-left">
      <div class="inline-block bg-sky-950 text-white ml-2 px-2 py-2 rounded-md shadow-md hover:shadow-2xl shadow-black hover:-translate-y-1 transition-all duration-300">
        <p class="font-semibold">{{ service.text }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</section>
