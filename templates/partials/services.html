<section id="services" class="mx-auto max-w-6xl scroll-mt-20 px-6 py-20">
  <div class="mb-10">
    <p class="text-sm font-semibold uppercase tracking-widest text-orange-400">What I do</p>
    <h2 class="mt-2 font-tektur text-3xl font-bold text-white md:text-4xl">How I can help</h2>
  </div>

  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-4">
    {% for service in services %}
    <div data-tilt="8" class="reveal rounded-xl border border-slate-800 bg-slate-900/60 p-6 transition hover:-translate-y-1 hover:border-orange-400/50">
      <div class="depth flex h-12 w-12 items-center justify-center rounded-lg bg-orange-400/10 text-xl text-orange-400">
        <i class="{{ service.icon }}"></i>
      </div>
      <h3 class="depth-sm mt-4 text-lg font-semibold text-white">{{ service.title }}</h3>
      <p class="mt-2 text-sm text-slate-400">{{ service.text }}</p>
    </div>
    {% endfor %}
  </div>
</section>
