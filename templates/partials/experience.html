<section id="experience" class="mx-auto max-w-6xl scroll-mt-20 px-6 py-20">
  <div class="mb-10">
    <p class="text-sm font-semibold uppercase tracking-widest text-orange-400">Experience</p>
    <h2 class="mt-2 font-tektur text-3xl font-bold text-white md:text-4xl">Where I've worked</h2>
  </div>

  <ol class="relative space-y-10 border-l border-slate-800 pl-8">
    {% for job in experience %}
    <li class="reveal relative">
      <span class="absolute -left-10 top-6 h-4 w-4 rounded-full border-4 border-slate-950 bg-orange-400"></span>
      <div data-tilt="3" class="rounded-xl border border-slate-800 bg-slate-900/60 p-6 transition hover:border-orange-400/50">
        <div class="flex flex-wrap items-baseline justify-between gap-2">
          <h3 class="text-lg font-semibold text-white">
            {{ job.role }} <span class="text-orange-400">· {{ job.company }}</span>
          </h3>
          <span class="text-sm text-slate-400">{{ job.period }}</span>
        </div>

        <ul class="mt-4 list-disc space-y-2 pl-5">
          {% for point in job.points %}
          <li>{{ point }}</li>
          {% endfor %}
        </ul>

        <div class="mt-4 flex flex-wrap gap-2">
          {% for tech in job.tech %}
          <span class="rounded-full bg-slate-800 px-3 py-1 text-xs text-slate-300">{{ tech }}</span>
          {% endfor %}
        </div>
      </div>
    </li>
    {% endfor %}
  </ol>
</section>
