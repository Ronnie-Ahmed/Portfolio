<section id="skills" class="mx-auto max-w-6xl scroll-mt-20 px-6 py-20">
  <div class="mb-10">
    <p class="text-sm font-semibold uppercase tracking-widest text-orange-400">Skills</p>
    <h2 class="mt-2 font-tektur text-3xl font-bold text-white md:text-4xl">Tools I work with</h2>
  </div>

  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    {% for group in skill_groups %}
    <div data-tilt="6" class="reveal rounded-xl border border-slate-800 bg-slate-900/60 p-6">
      <h3 class="depth-sm font-tektur text-lg font-semibold text-white">{{ group.title }}</h3>
      <div class="mt-4 flex flex-wrap gap-2">
        {% for skill in group.skills %}
        <span class="chip-3d inline-flex items-center gap-2 rounded-lg border border-slate-700 bg-slate-800/60 px-3 py-1.5 text-sm text-slate-200">
          {% if let Some(img) = skill.image %}
          <img src="/static/images/{{ img }}" alt="" loading="lazy" class="h-5 w-5 rounded-sm object-contain">
          {% endif %}
          {{ skill.name }}
        </span>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
