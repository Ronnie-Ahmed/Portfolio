<section id="experience" class="flex flex-col py-20 mt-6 bg-gray-400 rounded-2xl shadow-md hover:shadow-2xl shadow-slate-50">
  {% for group in skill_groups %}
  <div class="container mx-auto mb-10 px-4 flex flex-wrap justify-center items-center">
    <div class="flex flex-col items-center mb-6 mx-6 rounded-lg shadow-2xl shadow-black">
      <h1 class="text-3xl p-6 font-bold text-gray-800 tracking-wide leading-tight text-center">{{ group.title }}</h1>
    </div>
    {% for skill in group.skills %}
    <div class="flex flex-col items-center mb-6 mx-6 rounded-lg shadow-2xl shadow-black">
      <img src="/static/images/{{ skill.image }}" alt="{{ skill.name }}" loading="lazy"
           class="w-12 h-12 m-2 rounded-md transform hover:scale-110 transition-transform hover:shadow-2xl hover:rotate-3">
      <span class="text-gray-800 font-bold mx-4 text-sm uppercase tracking-wide hover:text-yellow-900 cursor-pointer transform hover:rotate-3 hover:scale-110 transition-transform">
        {{ skill.name }}
      </span>
    </div>
    {% endfor %}
  </div>
  {% endfor %}
</section>
