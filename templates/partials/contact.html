<section id="contactme" class="py-20 mt-6 mb-6 bg-gray-400 rounded-2xl shadow-md hover:shadow-2xl shadow-slate-50">
  <div class="container mx-auto px-4 py-16 rounded-lg shadow-2xl shadow-black bg-gradient-to-r from-gray-500 via-gray-300 to-gray-800">
    <div class="container mx-auto mb-10 px-4 flex flex-wrap justify-center items-center">
      <div class="flex flex-col text-center items-center mb-6 mx-6 rounded-lg shadow-2xl shadow-black">
        <h1 class="text-3xl p-6 font-bold text-gray-800 tracking-wide leading-tight">Contact Me</h1>
      </div>
    </div>

    <form id="contact-form" class="max-w-md mx-auto">
      <div class="mb-6">
        <label for="name" class="block mb-2 text-lg font-medium text-gray-800">Name</label>
        <input type="text" id="name" name="name" required
               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 text-gray-800">
      </div>
      <div class="mb-6">
        <label for="email" class="block mb-2 text-lg font-medium text-gray-800">Email</label>
        <input type="email" id="email" name="email" required
               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 text-gray-800">
      </div>
      <div class="mb-6">
        <label for="subject" class="block mb-2 text-lg font-medium text-gray-800">Subject</label>
        <input type="text" id="subject" name="subject" required
               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 text-gray-800">
      </div>
      <div class="mb-6">
        <label for="message" class="block mb-2 text-lg font-medium text-gray-800">Message</label>
        <textarea id="message" name="message" rows="4" required
                  class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 text-gray-800"></textarea>
      </div>
      <button type="submit"
              class="px-6 py-3 bg-blue-500 text-white font-bold rounded-md hover:bg-blue-700 transition-colors shadow-lg hover:shadow-xl">
        Send Email
      </button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init("0I-yVHiRaDswFf8r0");
  document.getElementById("contact-form").addEventListener("submit", function (e) {
    e.preventDefault();
    emailjs.sendForm("service_9uravqy", "template_xwadr1d", this).then(
      () => { alert("Email Sent Successfully"); this.reset(); },
      () => { alert("Email Not Sent"); }
    );
  });
</script>
